<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブログ収支管理ツール | おしえてかめさん</title>
    
    <!-- ホーム画面追加時＆ブラウザタブのアイコン設定（manifest.json不要） -->
    <link rel="apple-touch-icon" href="./images/IMG_4711.png">
    <link rel="icon" type="image/png" href="./images/IMG_4711.png">
    
    <!-- iOSでのモバイル表示調整 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="収支管理">

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <h1>🐢 ブログ収支管理ツール</h1>
            <p class="subtitle">累積で記録して成果を可視化しよう</p>
        </div>
    </header>

    <main class="container">
        <!-- サマリーカードエリア -->
        <section class="summary-section">
            <div class="card summary-card balance">
                <h3>収支（利益）</h3>
                <p id="total-balance">¥0</p>
            </div>
            <div class="card summary-card income">
                <h3>収入 合計</h3>
                <p id="total-income">¥0</p>
            </div>
            <div class="card summary-card expense">
                <h3>経費 合計</h3>
                <p id="total-expense">¥0</p>
            </div>
        </section>

        <!-- カテゴリー別収入サマリー -->
        <section class="card">
            <h2>📊 収入カテゴリー別内訳</h2>
            <div id="category-summary" class="category-grid">
                <!-- JSで動的に更新 -->
            </div>
        </section>

        <div class="grid-2col">
            <!-- 入力フォーム -->
            <section class="card">
                <h2>✍️ 収支の入力</h2>
                <form id="transaction-form">
                    <div class="form-group">
                        <label>区分</label>
                        <div class="radio-group">
                            <label><input type="radio" name="type" value="income" checked> 収入</label>
                            <label><input type="radio" name="type" value="expense"> 経費</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="category">カテゴリー</label>
                        <select id="category" required>
                            <option value="アドセンス">アドセンス</option>
                            <option value="A8.net">A8.net</option>
                            <option value="もしもアフィリエイト">もしもアフィリエイト</option>
                            <option value="Amazonアソシエイト">Amazonアソシエイト</option>
                            <option value="その他収入">その他収入</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="amount">金額 (円)</label>
                        <input type="number" id="amount" placeholder="例: 5000" min="1" required>
                    </div>

                    <div class="form-group">
                        <label for="memo">メモ（任意）</label>
                        <input type="text" id="memo" placeholder="例: サーバー代、○月確定分など">
                    </div>

                    <button type="submit" class="btn btn-primary">記録を追加する</button>
                </form>
            </section>

            <!-- データ管理機能 -->
            <section class="card">
                <h2>💾 データのバックアップ・復元</h2>
                <p class="description">ブラウザに自動保存されます。端末変更や破損に備え、定期的にCSVダウンロードを行ってください。</p>
                <div class="backup-actions">
                    <button id="export-btn" class="btn btn-secondary">CSVファイルを保存</button>
                    <label class="btn btn-outline">
                        CSVファイルを復元
                        <input type="file" id="import-file" accept=".csv" style="display: none;">
                    </label>
                </div>
            </section>
        </div>

        <!-- 履歴一覧 -->
        <section class="card">
            <h2>📜 履歴一覧</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>日付</th>
                            <th>区分</th>
                            <th>カテゴリー</th>
                            <th>金額</th>
                            <th>メモ</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="history-list">
                        <!-- JSで動的に追加 -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="./js/app.js"></script>
</body>
</html>
